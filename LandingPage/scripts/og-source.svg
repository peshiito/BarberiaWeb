<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1b17"/>
      <stop offset="100%" stop-color="#14130f"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#b8925a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#b8925a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lines" width="64" height="64" patternTransform="rotate(115)" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="64" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#lines)"/>

  <!-- marco editorial -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#3a3733" stroke-width="1.5"/>
  <rect x="40" y="40" width="64" height="64" fill="none" stroke="#b8925a" stroke-width="2"/>
  <rect x="1096" y="526" width="64" height="64" fill="none" stroke="#b8925a" stroke-width="2"/>

  <!-- brand mark -->
  <g transform="translate(120,205)">
    <circle cx="60" cy="60" r="57" fill="#1c1b17" stroke="#b8925a" stroke-width="4"/>
    <circle cx="60" cy="60" r="31" fill="none" stroke="#b8925a" stroke-width="10"/>
    <line x1="27" y1="85" x2="93" y2="35" stroke="#a84747" stroke-width="8" stroke-linecap="round"/>
    <circle cx="93" cy="35" r="5" fill="#d4ab73"/>
    <circle cx="27" cy="85" r="5" fill="#d4ab73"/>
  </g>

  <text x="290" y="270" font-family="Open Sans Condensed ExtraBold, Open Sans Condensed, sans-serif" font-size="96" font-weight="800" letter-spacing="4" fill="#ede9e3">OFICIO</text>
  <text x="290" y="358" font-family="Open Sans Condensed ExtraBold, Open Sans Condensed, sans-serif" font-size="96" font-weight="800" letter-spacing="4" fill="#b8925a">BARBERÍA</text>

  <line x1="292" y1="400" x2="760" y2="400" stroke="#4a4640" stroke-width="1.5"/>

  <text x="292" y="440" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#a39d94">Oficio clásico, filo moderno.</text>
  <text x="292" y="478" font-family="DejaVu Sans Condensed, sans-serif" font-size="19" letter-spacing="2" fill="#8a847c">RESERVÁ TU TURNO ONLINE</text>
</svg>
